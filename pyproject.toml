[project]
name = "ev-purchases"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "gavrilov.alikhan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "dotenv>=0.9.9",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruff>=0.17.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.65.0",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
ev-purchases = "ev_purchases:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend/src"
