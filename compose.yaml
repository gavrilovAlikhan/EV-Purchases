services:
  api:
    build: .
    image: ev_purchases:0.0.3
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/postcodes')"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s
  ui:
    build: .
    image: ev_purchases:0.0.3
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy